name: nf-test CI
on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

env:
  NXF_ANSI_LOG: false

jobs:
  test:
    name: Run the nf-test suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Nextflow versions: the manifest floor, and the version this is developed on.
        # No "latest-everything": the strict config parser in Nextflow 25+ rejects the
        # study_reads_folder() helpers that miassembler's publishDir closures call.
        NXF_VER: ["24.04.2", "24.04.3"]

    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4
        with:
          # this pipeline composes miassembler and genomes-generation from pipelines/;
          # without the submodules not a single import resolves
          submodules: recursive

      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@v2.0.0
        with:
          version: "${{ matrix.NXF_VER }}"

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1
        with:
          install-pdiff: true
          version: 0.9.2

      - name: Run the nf-test
        run: |
          nf-test test --ci

      # Not a real run: there is no test dataset. The pipeline needs a eukaryotic
      # metagenome plus a Branchwater index, neither of which is small enough to ship, and
      # several miassembler and GGP processes have no stub block, so -stub-run would
      # actually execute SPADES. -preview resolves the whole DAG, both cycles, and every
      # `file(..., checkIfExists: true)` in the config - which is what conf/test.config
      # points at placeholder paths for.
      - name: Build the DAG on the test profile
        run: |
          nextflow run main.nf -preview -profile test,docker --outdir results

      - name: Build the DAG with the first cycle skipped
        run: |
          nextflow run main.nf -preview -profile test,docker --outdir results --skip_first_assembly true
